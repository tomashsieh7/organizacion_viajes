services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: viajes
      POSTGRES_PASSWORD: viajes
      POSTGRES_DB: viajes
    ports:
      - '5432:5432'
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U viajes -d viajes']
      interval: 5s
      timeout: 5s
      retries: 10

  # Base para las pruebas: se guarda en memoria y se descarta al detener el contenedor.
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: viajes
      POSTGRES_PASSWORD: viajes
      POSTGRES_DB: viajes_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U viajes -d viajes_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos-db:
