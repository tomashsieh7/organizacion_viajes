# Integración continua: corre las mismas verificaciones que el README pide correr a mano (lint,
# pruebas de Vitest y pruebas de punta a punta) en cada pull request y en cada push a main. Las
# demás ramas se verifican a través de su pull request, así un mismo commit no corre dos veces.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior, que ya quedó vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  pruebas:
    name: Pruebas de Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Misma base de prueba que el servicio db-test de docker-compose.yml, en el mismo puerto.
    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: viajes
          POSTGRES_PASSWORD: viajes
          POSTGRES_DB: viajes_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U viajes -d viajes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Las mismas pruebas que `npm test`, midiendo la cobertura; el resumen queda en el log.
      - run: npm run cobertura
      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: |
            apps/api/coverage/
            apps/web/coverage/
          retention-days: 7

  e2e:
    name: Pruebas de punta a punta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # La base viajes_e2e se crea en este mismo servidor al preparar las pruebas.
    services:
      db-test:
        image: postgres:16
        env:
          POSTGRES_USER: viajes
          POSTGRES_PASSWORD: viajes
          POSTGRES_DB: viajes_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U viajes -d viajes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los navegadores de Playwright se guardan entre corridas. Con la caché no se instalan las
      # dependencias del sistema: la imagen de ubuntu-latest ya trae las que usa Chromium sin
      # ventana, y bajarlas con apt dependía de la velocidad del espejo de Ubuntu (a veces 9
      # minutos). Si un cambio de imagen deja afuera alguna, Chromium no arranca y los e2e lo dicen.
      - name: Recuperar los navegadores de Playwright
        id: navegadores
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Guardar el reporte si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
