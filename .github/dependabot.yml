# Actualizaciones automáticas: una vez por semana GitHub abre PRs contra main con las dependencias de
# npm (agrupando versiones menores y parches) y con las acciones del CI. Cada PR pasa por el CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # vue-tsc todavía no soporta TypeScript 7; se actualiza a mano cuando lo haga.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
